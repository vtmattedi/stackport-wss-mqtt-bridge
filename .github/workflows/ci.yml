name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun ci
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Validate Stackport Compose
        run: docker compose -f docker-compose.stackport.yml config --quiet
      - name: Build production Docker image
        run: docker build --pull -t stackport-wss-mqtt-bridge:ci .
